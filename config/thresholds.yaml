clahe:
  clip_limit: 2.0
  enabled: true
  tile_grid_size:
  - 8
  - 8
danger:
  environment_modifier:
    elderly_child: 1
    outdoor_road_work: 1
  extended_inactivity_seconds: 30
  flags:
  - CARDIAC_SIGNAL
  - HEATSTROKE_RISK
  - SEIZURE_PATTERN
  - SYNCOPE_PATTERN
  - STROKE_ASYMMETRY
  - INTOXICATION_PATTERN
  - ROAD_ENVIRONMENT
  - OUTDOOR_HEAT_RISK
  - WORKPLACE_HAZARD
  - ALONE_NO_HELP
  - PRONE_POSITION
  - EXTENDED_INACTIVITY
  - NO_PROTECTIVE_REFLEX
  immobile_seconds: 5
  record_threshold_level: 2
fall:
  bbox_ratio_thresh: 1.3
  confirm_seconds: 4.0
  cooldown_seconds: 120
  critical_seconds: 30.0
  danger_lying_seconds: 15.0
  danger_max_seconds: 120.0
  danger_min_seconds: 3.0
  geometry_angle_thresh: 25.0
  geometry_confirm_seconds: 3.0
  geometry_ratio_thresh: 1.8
  history_len: 16
  lying_angle_thresh: 40.0
  motion_thresh_norm: 0.02
  recover_seconds: 5.0
  spike_thresh_norm: 0.18
  spine_angle_thresh: 55.0
  sustain_seconds: 1.0
  temporal_threshold: 0.4
  temporal_window: 10
  warning_seconds: 2.0
fall_warning:
  cooldown_seconds: 5
  temporal_threshold: 0.35
  temporal_window: 10
general:
  detector_url: http://127.0.0.1:8000
  frame_skip: 1
  person_conf: 0.3
  yolo_model: ../models/yolov8n-pose.pt
hand_sos:
  cooldown_seconds: 60
  min_detection_confidence: 0.30
  min_hand_bbox_area_norm: 0.0015
  min_kp_conf: 0.4
  min_tracking_confidence: 0.25
  temporal_threshold: 0.4
  temporal_window: 10
  thumb_in_ratio: 0.70
  fingers_closed_ratio: 1.40
  fingers_closed_min_count: 2
  allow_fast_sos: true
  min_track_age_seconds: 0.4
  # [FIX-FP] temporal persistence ลด false positive
  fingers_closed_strict_ratio: 1.20
  fast_sos_min_hand_span: 0.04
  min_consec_sos_frames: 3

object_guardian:
  cooldown_seconds: 60
  left_behind_seconds: 15
  min_confidence: 0.25
  theft_seconds: 8
  track_iou_threshold: 0.15
  track_max_missed: 15
record_only_dangerous: false
streaming:
  confirmation_window: 30
  fps: 10
  lying_angle_thresh: 45
  rolling_window: 90
  trigger_angle_delta: 30
  trigger_frames: 5
