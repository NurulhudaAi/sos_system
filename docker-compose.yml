services:
  # ============================================================================
  # 1. Model Inference Server (FastAPI + YOLOv8 + MediaPipe)
  # ============================================================================
  model-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sos-model-server
    command: ["python3", "model_server.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./alerts:/app/alerts
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Main Detection Pipeline (RTSP / Video Processor + MongoDB Dispatcher)
  # ============================================================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sos-pipeline
    # ค่าเริ่มต้นรันดึงกล้อง Active จาก MongoDB Atlas
    # สามารถปรับเปลี่ยน command ได้ เช่น: ["python3", "main.py", "--source", "/app/videos/sample.mp4"]
    command: ["python3", "main.py", "--from-db"]
    depends_on:
      model-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DETECTOR_URL=http://model-server:8000
    ports:
      - "8081:8081"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./alerts:/app/alerts
      - ./config:/app/config
      - ./videos:/app/videos
    restart: unless-stopped
